name: Release

on:
  release:
    types: [released]

jobs:
  build-upload:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pypi upload
      contents: read # required for checkout

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # uv publish automatically detects the OIDC token in GitHub Actions
        run: uv publish
