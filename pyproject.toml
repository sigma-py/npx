[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npx"
version = "0.1.8"
authors = [{ name = "Nico Schlömer", email = "nico.schloemer@gmail.com" }]
description = "Some useful extensions for NumPy"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
  "numpy >= 1.20.0",
  # "scipy >= 1.8",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[project.urls]
Code = "https://github.com/sigma-py/npx"
Issues = "https://github.com/sigma-py/npx/issues"

[tool.ruff]
src = ["src", "tests"]
line-length = 88
lint.select = ["ALL"]
lint.ignore = [
  "ANN",
  "COM812",
  "S101",
  "D",
  "T201",
  "ERA",
  "N803",
  "PLR2004",
  #   "ANN", "C901", "D", "E741", "ERA", "FBT", "INP001",
  #   "N", "PLR", "S101", "T201", "TID252", "TD", "FIX002"
]
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
